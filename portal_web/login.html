<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpStream | Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Corporate Styles -->
    <link href="style.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100"
    style="background: linear-gradient(135deg, #001f3f 0%, #003366 50%, #004d99 100%);">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
                    <!-- Cabecera del Login -->
                    <div class="card-header bg-white text-center pt-4 pb-3 border-0">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
                            style="width: 64px; height: 64px;">
                            <i class="bi bi-layers-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-primary mb-1">HelpStream</h3>
                        <p class="text-muted small mb-0">Portal de Gestión & Soporte TI</p>
                    </div>

                    <!-- Cuerpo con Formulario -->
                    <div class="card-body p-4 pt-2">
                        <!-- Alerta de Error -->
                        <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

                        <form id="loginForm" novalidate>
                            <!-- Campo Correo -->
                            <div class="mb-3">
                                <label for="loginCorreo"
                                    class="form-label small fw-bold text-muted text-uppercase">Correo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="loginCorreo"
                                        placeholder="usuario@empresa.com" required autocomplete="email">
                                </div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-4">
                                <label for="loginPassword"
                                    class="form-label small fw-bold text-muted text-uppercase">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="loginPassword"
                                        placeholder="••••••••" required autocomplete="current-password">
                                </div>
                            </div>

                            <!-- Botón Ingresar -->
                            <div class="d-grid mb-3">
                                <button type="submit" id="btnLogin" class="btn btn-primary py-2 fw-bold shadow-sm"
                                    style="border-radius: 8px;">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Pie de Tarjeta -->
                    <div class="card-footer bg-light border-0 text-center py-3">
                        <small class="text-muted">
                            <i class="bi bi-shield-check text-success me-1"></i> Autenticación segura con JWT
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica de la aplicación -->
    <script src="app.js"></script>
</body>

</html>
